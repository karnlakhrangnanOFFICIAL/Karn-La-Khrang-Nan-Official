  <!-- ==================== MAIN ==================== -->
  <main class="main-container">
    <div id="matchContent" class="loading" style="max-width: 860px; margin: 0 auto;">

  <!-- ==================== FOOTER ==================== -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-logo">
        <img src="assets/images/karnlakhrangnan-logo.png" alt="KARN LA KHRANg NAN Logo" style="height:40px;">
        <span>KARN LA KHRANg NAN</span>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="assets/js/main.js"></script>
  <script>
    // ---------- HELPERS (not in main.js) ----------
    let playerImageMap = {};
    let playerIdMap = {};
    let playerTeamMap = {};

    function normalizeName(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/-/g, ' ')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9 ]/g, '')
        .trim();
    }

    function getPlayerImage(playerName) {
      if (!playerName) return 'assets/images/placeholder-player.svg';
      const norm = normalizeName(playerName);

      if (playerImageMap[norm]) return playerImageMap[norm];

      for (const [k, imgUrl] of Object.entries(playerImageMap)) {
        if (norm.includes(k) || k.includes(norm)) {
          return imgUrl;
        }
      }

      if (norm.includes('satpaev')) return 'assets/images/players/dastan-satpaev.webp';
      if (norm.includes('essugo')) return 'assets/images/players/dario-essugo.webp';
      if (norm.includes('gittens')) return 'assets/images/players/jamie-bynoe-gittens.webp';
      if (norm.includes('rogers')) return 'assets/images/players/morgan-rogers.webp';
      if (norm.includes('palmer')) return 'assets/images/players/cole-palmer.webp';
      if (norm.includes('caicedo')) return 'assets/images/players/moises-caicedo.webp';
      if (norm.includes('james')) return 'assets/images/players/james.webp';
      if (norm.includes('estevao')) return 'assets/images/players/estevao.webp';
      if (norm.includes('pedro')) return 'assets/images/players/joao-pedro.webp';
      if (norm.includes('enzo') || norm.includes('fernandez')) return 'assets/images/players/enzo-fernandez.webp';

      const slug = norm.replace(/\s+/g, '-');
      return `assets/images/players/${slug}.webp`;
    }

    function getPlayerIdByName(playerName) {
      if (!playerName) return '';
      const norm = normalizeName(playerName);
      if (playerIdMap[norm]) return playerIdMap[norm];
      for (const [k, idVal] of Object.entries(playerIdMap)) {
        if (norm === k) {
          return idVal;
        }
      }
      return encodeURIComponent(playerName);
    }

    function getPlayerTeamByName(playerName, defaultTeam) {
      if (!playerName) return defaultTeam || 'men';
      const norm = normalizeName(playerName);
      if (playerTeamMap[norm]) return playerTeamMap[norm];
      for (const [k, teamVal] of Object.entries(playerTeamMap)) {
        if (norm.includes(k) || k.includes(norm)) {
          return teamVal;
        }
      }
      return defaultTeam || 'men';
    }

    function formatDate(dateString, lang) {
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      if (lang === 'th') {
        const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const thaiYear = date.getFullYear() + 543;
        return `${date.getDate()} ${thaiMonths[date.getMonth()]} ${thaiYear}`;
      }
      return date.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function formatCompetitionName(name) {
      if (!name) return '';
      return name.replace(/-/g, ' ').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    // ---------- LOAD & RENDER ----------
    async function loadMatchDetail() {
      const container = document.getElementById('matchContent');
      try {
        const params = new URLSearchParams(window.location.search);
        const matchId = params.get('id');
        if (!matchId) {
          container.innerHTML = '<div class="not-found"><p>⚠️ ไม่พบรหัสการแข่งขัน</p></div>';
          return;
        }

        try {
          let playersMen = [];
          if (typeof fetchPlayersFromSheet === 'function') {
            try { playersMen = await fetchPlayersFromSheet(true) || []; } catch(e) {}
          }
          if (!playersMen || playersMen.length === 0) {
            const resPMen = await fetch('data/players-men.json');
            if (resPMen.ok) playersMen = await resPMen.json();
          }
          
          if (playersMen && playersMen.length > 0) {
            playersMen.forEach(p => {
              if (p.name) {
                const n = normalizeName(p.name);
                if (p.image) playerImageMap[n] = p.image;
                if (p.id) playerIdMap[n] = p.id;
                playerTeamMap[n] = 'men';
                const parts = n.split(' ');
                if (parts.length > 1) {
                  const last = parts[parts.length - 1];
                  if (last.length > 2) {
                    if (!playerImageMap[last] && p.image) playerImageMap[last] = p.image;
                    if (!playerIdMap[last] && p.id) playerIdMap[last] = p.id;
                    if (!playerTeamMap[last]) playerTeamMap[last] = 'men';
                  }
                }
              }
            });
          }
        } catch(e) { console.warn('Error loading men players', e); }

        try {
          let playersWomen = [];
          if (typeof fetchPlayersFromSheet === 'function') {
            try { playersWomen = await fetchPlayersFromSheet(false) || []; } catch(e) {}
          }
          if (!playersWomen || playersWomen.length === 0) {
            const resPWomen = await fetch('data/players-women.json');
            if (resPWomen.ok) playersWomen = await resPWomen.json();
          }

          if (playersWomen && playersWomen.length > 0) {
            playersWomen.forEach(p => {
              if (p.name) {
                const n = normalizeName(p.name);
                if (p.image) playerImageMap[n] = p.image;
                if (p.id) playerIdMap[n] = p.id;
                playerTeamMap[n] = 'women';
                const parts = n.split(' ');
                if (parts.length > 1) {
                  const last = parts[parts.length - 1];
                  if (last.length > 2) {
                    if (!playerImageMap[last] && p.image) playerImageMap[last] = p.image;
                    if (!playerIdMap[last] && p.id) playerIdMap[last] = p.id;
                    if (!playerTeamMap[last]) playerTeamMap[last] = 'women';
                  }
                }
              }
            });
          }
        } catch(e) { console.warn('Error loading women players', e); }

        let allMatches = [];
        try {
          const resMen = await fetch('data/fixtures-men.json');
          if (resMen.ok) {
            const dataMen = await resMen.json();
            for (const comp in dataMen) {
              if (Array.isArray(dataMen[comp])) {
                dataMen[comp].forEach(m => allMatches.push({ ...m, competition_name: comp, team_type: 'men' }));
              }
            }
          }
        } catch(e) {}

        try {
          const resWomen = await fetch('data/fixtures-women.json');
          if (resWomen.ok) {
            const dataWomen = await resWomen.json();
            for (const comp in dataWomen) {
              if (Array.isArray(dataWomen[comp])) {
                dataWomen[comp].forEach(m => allMatches.push({ ...m, competition_name: comp, team_type: 'women' }));
              }
            }
          }
        } catch(e) {}

        const match = allMatches.find(m => String(m.id) === String(matchId));
        if (!match) {
          container.innerHTML = '<div class="not-found"><p>⚠️ ไม่พบข้อมูลการแข่งขันนี้</p></div>';
          return;
        }

        renderMatchDetail(match, container);
      } catch (error) {
        container.innerHTML = '<div class="not-found"><p>⚠️ ไม่สามารถโหลดข้อมูลได้</p></div>';
      }
    }

    let currentMatch = null;

    function renderMatchDetail(match, container) {
      currentMatch = match;
      const lang = window.currentLang || 'th';
      const compName = formatCompetitionName(match.competition_name || match.competition);
      const rawTime = match.time_uk || match.time_th || match.time;
      const displayTime = (!rawTime || rawTime === '00:00' || rawTime === 'TBC') ? 'TBC' : rawTime.substring(0,5);

      // Channels / Logo TV
      const channelsHtml = (match.channels && match.channels.length > 0)
        ? `<div class="channels-list detail-channels">${match.channels.map(ch => 
            `<span class="channel-badge" title="${ch.name}">
              ${ch.logo ? `<img src="${ch.logo}" alt="${ch.name}" title="${ch.name}" class="channel-logo" onerror="this.style.display='none'">` : `<span class="channel-name">${ch.name}</span>`}
            </span>`
          ).join('')}</div>`
        : '';

      // Video Section
      const videoHtml = match.video
        ? `<div class="video-card">
            <h3 class="section-subtitle">🎥 ไฮไลท์การแข่งขัน</h3>
            <div class="video-wrapper">
              <iframe src="https://www.youtube-nocookie.com/embed/${match.video.id}" title="${match.video.title || 'Match Highlights'}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            ${match.video.desc_th ? `<p class="video-caption" data-lang-th="${match.video.desc_th || ''}" data-lang-en="${match.video.desc_en || ''}">${match.video.desc_th}</p>` : ''}
          </div>`
        : '';

      // Score
      const scoreHtml = match.status === 'completed'
        ? `<div class="score-box">
             <div class="score-numbers">
               <span class="score-home">${match.home_score}</span>
               <span class="score-dash">-</span>
               <span class="score-away">${match.away_score}</span>
             </div>
             <span class="match-status-badge">FULL TIME</span>
           </div>`
        : `<div class="vs-box">
             <span class="vs-text">VS</span>
           </div>`;

      // Goals Section
      let goalsHtml = '';
      if (match.status === 'completed' && match.goals) {
        const homeGoals = match.goals.filter(g => g.team === 'home');
        const awayGoals = match.goals.filter(g => g.team === 'away');

        const isHomeChelsea = match.home_team && match.home_team.toLowerCase().includes('chelsea');
        const isAwayChelsea = match.away_team && match.away_team.toLowerCase().includes('chelsea');
        const teamType = match.team_type || 'men';

        const renderGoalItem = (g, isChelsea) => {
          const imgUrl = getPlayerImage(g.player);
          const pId = getPlayerIdByName(g.player);
          const pTeam = getPlayerTeamByName(g.player, teamType);
          if (isChelsea) {
            return `<li><a href="player-profile.html?id=${pId}&team=${pTeam}" class="scorer-link"><span class="goal-icon"><img src="${imgUrl}" alt="${g.player}" class="goal-player-img" loading="lazy" onerror="this.src='assets/images/placeholder-player.svg'"></span> <strong>${g.player}</strong></a> <span class="goal-time">${g.minute}'</span></li>`;
          } else {
            return `<li><span class="goal-icon"><img src="${imgUrl}" alt="${g.player}" class="goal-player-img" loading="lazy" onerror="this.src='assets/images/placeholder-player.svg'"></span> <strong>${g.player}</strong> <span class="goal-time">${g.minute}'</span></li>`;
          }
        };

        const homeGoalsList = homeGoals.length > 0
          ? homeGoals.map(g => renderGoalItem(g, isHomeChelsea)).join('')
          : '<li class="no-goals">-</li>';

        const awayGoalsList = awayGoals.length > 0
          ? awayGoals.map(g => renderGoalItem(g, isAwayChelsea)).join('')
          : '<li class="no-goals">-</li>';

        goalsHtml = `
          <div class="goals-card">
            <h3 class="section-subtitle" data-i18n="match.goals">⚽ ผู้ทำประตู</h3>
            <div class="goals-grid">
              <div class="goals-col home-col">
                <div class="col-team-name">${renderTeamNameHTML(match.home_team)}</div>
                <ul class="goals-list">${homeGoalsList}</ul>
              </div>
              <div class="goals-col away-col">
                <div class="col-team-name">${renderTeamNameHTML(match.away_team)}</div>
                <ul class="goals-list">${awayGoalsList}</ul>
              </div>
            </div>
          </div>
        `;
      }

      const isWomenMatch = match.team_type === 'women' || (match.competition_name && match.competition_name.toLowerCase().includes('wsl')) || (match.home_team && match.home_team.toLowerCase().includes('women')) || (match.away_team && match.away_team.toLowerCase().includes('women'));
      const backHref = isWomenMatch ? 'women-team.html' : 'men-team.html';
      const backText = lang === 'th' ? (isWomenMatch ? '← กลับหน้าทีมหญิง' : '← กลับหน้าทีมชาย') : (isWomenMatch ? '← Back to Women\'s Team' : '← Back to Men\'s Team');

      const menNav = document.querySelector('.nav-links a[href="men-team.html"]');
      const womenNav = document.querySelector('.nav-links a[href="women-team.html"]');
      if (menNav && womenNav) {
        if (isWomenMatch) {
          womenNav.classList.add('active');
          menNav.classList.remove('active');
        } else {
          menNav.classList.add('active');
          womenNav.classList.remove('active');
        }
      }

      container.innerHTML = `
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <a href="${backHref}" class="back-link">${backText}</a>
        </div>
        
        <!-- Header Meta -->
        <div class="match-header-meta">
          ${compName ? `<span class="comp-badge">${compName}</span>` : ''}
          <div class="meta-pills">
            <span class="meta-pill">📅 ${formatDate(match.date, window.currentLang || 'th')}</span>
            <span class="meta-pill">🕒 ${displayTime}</span>
            <span class="meta-pill">🏟️ ${match.venue}</span>
          </div>
        </div>

        <!-- Scoreboard -->
        <div class="match-scoreboard">
          <div class="team-block home">
            <img src="${match.home_logo}" alt="${match.home_team}" class="team-logo" onerror="this.src='assets/images/placeholder-team.svg'">
            <div class="team-divider"></div>
            <div class="team-name">${renderTeamNameHTML(match.home_team)}</div>
          </div>

          <div class="match-center-block">
            ${channelsHtml}
            ${scoreHtml}
          </div>

          <div class="team-block away">
            <img src="${match.away_logo}" alt="${match.away_team}" class="team-logo" onerror="this.src='assets/images/placeholder-team.svg'">
            <div class="team-divider"></div>
            <div class="team-name">${renderTeamNameHTML(match.away_team)}</div>
          </div>
        </div>

        <!-- Goals -->
        ${goalsHtml}

        <!-- Video -->
        ${videoHtml}
      `;

      if (typeof updateUIText === 'function') updateUIText();
    }

    // Start
    document.addEventListener('DOMContentLoaded', () => {
      loadMatchDetail();
      window.addEventListener('languageChanged', () => {
        if (currentMatch) {
          const container = document.getElementById('matchContent');
          if (container) renderMatchDetail(currentMatch, container);
        }
      });
    });
  </script>
</body>
